[package]
name = "nightsleep"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Tiny Windows tray utility for deep screen dimming"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ohdgg/nightsleep-monitor"
readme = "README.md"
publish = false

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[lints.rust]
# `nightsleep_typecheck` lets the Win32 modules be type-checked on a non-Windows
# host: RUSTFLAGS="--cfg nightsleep_typecheck" cargo check
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightsleep_typecheck)'] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
