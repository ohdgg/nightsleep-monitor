name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $dir = "nightsleep-monitor-$tag-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/nightsleep-monitor.exe $dir
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"
          Get-FileHash "$dir.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $dir.zip" } | Set-Content "$dir.zip.sha256"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          gh release create $tag "nightsleep-monitor-$tag-windows-x64.zip" "nightsleep-monitor-$tag-windows-x64.zip.sha256" `
            --title "NightSleep-Monitor $tag" --generate-notes --target "${{ github.sha }}"
