name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Upper bound for the release exe (project goal: < 500 KB).
  MAX_EXE_BYTES: 512000

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Check exe size
        shell: pwsh
        run: |
          $size = (Get-Item target/release/nightsleep.exe).Length
          Write-Host "nightsleep.exe: $size bytes (limit $env:MAX_EXE_BYTES)"
          if ($size -gt [int]$env:MAX_EXE_BYTES) { throw "exe is too large" }

      - uses: actions/upload-artifact@v4
        with:
          name: nightsleep-windows-x64
          path: target/release/nightsleep.exe
